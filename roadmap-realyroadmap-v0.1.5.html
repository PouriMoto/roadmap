<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>نقشه راه تحلیلگر مالی</title>

<link rel="stylesheet" href="https://unpkg.com/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/marked@12.0.0/marked.min.js"></script>

<style>
  :root {
    --bg: #f1f5f9;
    --surface: #ffffff;
    --primary: #3b82f6;
    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;
    --text: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    
    --lvl-beg: #10b981;
    --lvl-mid: #f59e0b;
    --lvl-adv: #ef4444;
  }
  * { box-sizing: border-box; font-family: 'Vazirmatn', Tahoma, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
  #app { height: 100vh; display: flex; flex-direction: column; position: relative; }

  /* Top Bar */
  .top-bar { background: var(--surface); padding: 14px 16px 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); z-index: 10; }
  .top-title-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
  .top-title { font-size: 15px; font-weight: 700; flex: 1; }
  .top-title .ti { font-size: 20px; vertical-align: -3px; margin-left: 6px; color: var(--primary); }
  .role-toggle { display: flex; background: #f1f5f9; border-radius: 10px; padding: 3px; gap: 2px; }
  .role-toggle button { border: none; background: none; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 4px; }
  .role-toggle button .ti { font-size: 14px; }
  .role-toggle button.active { background: var(--surface); color: var(--primary); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .pct-badge { background: #dbeafe; color: var(--primary); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }
  .progress-track { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #3b82f6, #10b981); transition: width .4s ease; }

  /* Roadmap Timeline (Stairs) */
  .canvas-wrap { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 20px 16px 100px; position: relative; }
  .stage-container { position: relative; padding-bottom: 20px; }
  .stage-container::before { content: ''; position: absolute; top: 0; bottom: 0; right: 28px; width: 4px; background: var(--border); border-radius: 2px; z-index: 0; }
  .stage-header { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 10px; margin-bottom: 20px; background: var(--bg); padding: 4px 0; }
  .stage-dot { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 4px solid var(--bg); box-shadow: 0 2px 6px rgba(0,0,0,.1); flex-shrink: 0; }
  .stage-title { font-size: 18px; font-weight: 800; }
  .stage-sub { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .stage-beg .stage-dot { background: #d1fae5; color: #047857; }
  .stage-beg .stage-title { color: #047857; }
  .stage-mid .stage-dot { background: #fef3c7; color: #b45309; }
  .stage-mid .stage-title { color: #b45309; }
  .stage-adv .stage-dot { background: #fee2e2; color: #b91c1c; }
  .stage-adv .stage-title { color: #b91c1c; }

  .node-row { position: relative; z-index: 1; display: flex; gap: 12px; margin-bottom: 16px; padding-right: 10px; }
  .node-indicator { width: 40px; display: flex; justify-content: center; padding-top: 14px; flex-shrink: 0; }
  .node-circle { width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 3px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 10px; color: transparent; }
  .node-circle.done { background: var(--success); border-color: var(--success); color: #fff; }
  .node-circle.learning { background: var(--warning); border-color: var(--warning); color: #fff; }

  .node-card { flex: 1; background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(0,0,0,.04); cursor: pointer; transition: transform .15s; display: flex; align-items: center; gap: 10px; }
  .node-card:active { transform: scale(.98); }
  .node-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .node-body { flex: 1; min-width: 0; }
  .node-title { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .node-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .resource-badge { background: #e0e7ff; color: #4338ca; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 6px; }
  .cat-hard .node-icon { background: #dbeafe; color: #2563eb; }
  .cat-soft .node-icon { background: #d1fae5; color: #059669; }
  .cat-tool .node-icon { background: #ede9fe; color: #7c3aed; }
  .cat-cert .node-icon { background: #fef3c7; color: #d97706; }
  .cat-biz .node-icon { background: #fee2e2; color: #dc2626; }
  .node-card.status-done { border-color: #34d399; background: #f0fdf4; }
  .node-card.status-done .node-title::after { content: " ✓"; color: #059669; font-weight: 700; }
  .node-card.status-learning { border-color: #fbbf24; background: #fffbeb; }

  /* Skip Button */
  .skip-btn { position: relative; z-index: 1; margin: 10px 40px 20px 0; width: calc(100% - 40px); background: linear-gradient(135deg, #eff6ff, #dbeafe); border: 2px dashed #93c5fd; color: #2563eb; padding: 16px; border-radius: 16px; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; transition: all .2s; }
  .skip-btn:active { background: #bfdbfe; transform: scale(.98); }
  .skip-btn .ti { font-size: 20px; }
  .skip-btn.done { background: #f0fdf4; border-color: #86efac; color: #15803d; border-style: solid; cursor: default; }

  /* Sheet */
  .sheet-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.4); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 90; }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; height: 82vh; max-height: 82vh; background: var(--surface); border-radius: 24px 24px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,.15); transform: translateY(100%); transition: transform .3s cubic-bezier(.4,0,.2,1); z-index: 100; display: flex; flex-direction: column; }
  .sheet.show { transform: translateY(0); }
  .sheet-handle { width: 40px; height: 4px; background: #cbd5e1; border-radius: 2px; margin: 10px auto 4px; flex-shrink: 0; }
  .sheet-header { display: flex; align-items: center; gap: 10px; padding: 4px 20px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .sheet-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; background: var(--bg); }
  .sheet-title { flex: 1; font-size: 15px; font-weight: 700; min-width: 0; }
  .sheet-subtitle { font-size: 11.5px; color: var(--text-muted); margin-top: 2px; }
  .sheet-close { border: none; background: #f1f5f9; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; color: var(--text-muted); cursor: pointer; flex-shrink: 0; }
  .sheet-body { flex: 1; overflow-y: auto; padding: 16px 20px 24px; }

  /* Forms & Pickers (Same as old great design) */
  .chip-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .chip { flex: 1; padding: 10px 6px; border-radius: 12px; border: 1.5px solid var(--border); background: #f8fafc; cursor: pointer; font-size: 12px; font-weight: 600; text-align: center; color: var(--text-muted); transition: all .15s; }
  .chip .ti { display: block; font-size: 18px; margin-bottom: 2px; }
  .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .chip.active-learning { background: var(--warning); color: #fff; border-color: var(--warning); }
  .chip.active-done { background: var(--success); color: #fff; border-color: var(--success); }

  .md-content { font-size: 14px; line-height: 1.85; color: #1e293b; }
  .md-content h2 { font-size: 15px; margin: 18px 0 8px; }
  .md-content h3 { font-size: 14px; margin: 14px 0 6px; }
  .md-content ul { padding-right: 20px; margin: 6px 0; }
  .md-content a { color: var(--primary); text-decoration: none; }

  .action-btn { width: 100%; padding: 14px; border-radius: 14px; border: none; background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; margin-top: 16px; }
  .action-btn:active { background: #2563eb; }
  .action-btn .ti { font-size: 18px; }

  /* Resources */
  .res-section { margin-top: 18px; }
  .res-section-head { display: flex; align-items: center; justify-content: space-between; font-size: 13.5px; font-weight: 700; margin-bottom: 12px; }
  .res-section-head .label { display: flex; align-items: center; gap: 6px; }
  .res-section-head .label .ti { color: var(--primary); font-size: 16px; }
  .res-total { background: var(--bg); color: var(--text-muted); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  .level-group { margin-bottom: 12px; border-radius: 14px; overflow: hidden; border: 1px solid var(--border); background: #fafbfc; }
  .level-header { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; user-select: none; background: var(--surface); }
  .level-header:active { background: #f8fafc; }
  .level-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot-beginner { background: var(--lvl-beg); }
  .dot-intermediate { background: var(--lvl-mid); }
  .dot-advanced { background: var(--lvl-adv); }
  .level-name { flex: 1; font-size: 13.5px; font-weight: 700; }
  .level-count { font-size: 11px; font-weight: 700; color: var(--text-muted); background: var(--bg); padding: 2px 8px; border-radius: 10px; }
  .level-chevron { font-size: 16px; color: var(--text-muted); transition: transform .2s; }
  .level-chevron.open { transform: rotate(180deg); }
  .level-body { padding: 0 12px 12px; }
  .type-filter-row { display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 6px; margin-bottom: 8px; }
  .type-filter-row::-webkit-scrollbar { display: none; }
  .type-filter { flex-shrink: 0; padding: 5px 10px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); font-size: 11px; font-weight: 600; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; gap: 3px; }
  .type-filter .ti { font-size: 12px; }
  .type-filter.active { background: #eff6ff; color: var(--primary); border-color: #93c5fd; }
  .res-card { padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); margin-bottom: 8px; }
  .res-card:last-child { margin-bottom: 0; }
  .res-card-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; }
  .res-type-icon { width: 34px; height: 34px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
  .res-card-body { flex: 1; min-width: 0; }
  .res-title { font-weight: 700; font-size: 13px; margin-bottom: 2px; line-height: 1.3; }
  .res-url { color: var(--primary); font-size: 11px; word-break: break-all; display: block; text-decoration: none; }
  .res-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 6px; display: inline-flex; align-items: center; gap: 3px; }
  .badge .ti { font-size: 11px; }
  .badge-source-admin { background: #dbeafe; color: #1e40af; }
  .badge-source-user { background: #d1fae5; color: #065f46; }
  .badge-free { background: #d1fae5; color: #047857; }
  .badge-paid { background: #fee2e2; color: #b91c1c; }
  .badge-freemium { background: #fef3c7; color: #b45309; }
  .badge-lang { background: #e0f2fe; color: #0369a1; }
  .badge-new { background: #fce7f3; color: #be185d; }
  
  .type-course { background: #dbeafe; color: #1d4ed8; }
  .type-bootcamp { background: #fce7f3; color: #be185d; }
  .type-video { background: #fee2e2; color: #b91c1c; }
  .type-article { background: #e0f2fe; color: #0369a1; }
  .type-book { background: #fef3c7; color: #b45309; }
  .type-docs { background: #ede9fe; color: #6d28d9; }
  .type-file { background: #d1fae5; color: #047857; }
  .type-podcast { background: #fae8ff; color: #a21caf; }
  .type-newsletter { background: #ecfccb; color: #4d7c0f; }
  .type-community { background: #cffafe; color: #0e7490; }
  .type-tool { background: #ede9fe; color: #7c3aed; }
  .type-certification { background: #fef9c3; color: #a16207; }
  .type-other { background: #f1f5f9; color: #475569; }

  .res-vote-row { display: flex; gap: 8px; margin-top: 8px; }
  .vote-btn { flex: 1; padding: 6px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; color: var(--text-muted); }
  .vote-btn.voted-up { background: #d1fae5; color: #047857; border-color: #a7f3d0; }
  .vote-btn.voted-down { background: #fee2e2; color: #b91c1c; border-color: #fecaca; }

  /* Forms */
  .form-field { margin-bottom: 12px; }
  .form-field label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); display: block; margin-bottom: 6px; }
  .form-field input, .form-field textarea, .form-field select { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--border); background: #f8fafc; font-size: 14px; font-family: inherit; resize: none; }
  .form-field input:focus, .form-field textarea:focus, .form-field select:focus { outline: none; border-color: var(--primary); background: #fff; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .form-actions { display: flex; gap: 10px; margin-top: 16px; }
  .btn-secondary { flex: 1; padding: 13px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-primary { flex: 1; padding: 13px; border-radius: 14px; border: none; background: var(--primary); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }

  .type-picker { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .type-picker .type-item { padding: 8px 4px; border-radius: 10px; border: 1.5px solid var(--border); background: #f8fafc; cursor: pointer; text-align: center; font-size: 10px; font-weight: 600; color: var(--text-muted); }
  .type-picker .type-item .ti { display: block; font-size: 18px; margin-bottom: 2px; }
  .type-picker .type-item.selected { border-color: var(--primary); background: #eff6ff; color: var(--primary); }
  .level-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .level-picker .lv-item { padding: 10px 6px; border-radius: 10px; border: 1.5px solid var(--border); background: #f8fafc; cursor: pointer; text-align: center; font-size: 12px; font-weight: 700; color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
  .level-picker .lv-item .dot { width: 8px; height: 8px; border-radius: 50%; }
  .level-picker .lv-item.selected { border-color: var(--primary); background: #eff6ff; color: var(--primary); }

  .empty-state { text-align: center; color: var(--text-muted); font-size: 13px; padding: 30px 20px; }
  .empty-state .ti { font-size: 40px; display: block; margin-bottom: 8px; opacity: .4; }
  .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1e293b; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 13px; opacity: 0; transition: all .3s; z-index: 200; pointer-events: none; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Admin */
  .admin-wrap { flex: 1; overflow-y: auto; padding: 16px 16px 100px; }
  .admin-header { background: var(--surface); padding: 24px; border-radius: 20px; text-align: center; margin-bottom: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.05); }
  .admin-header .ti { font-size: 48px; color: var(--primary); margin-bottom: 12px; }
  .admin-tabs { display: flex; gap: 6px; background: var(--surface); border-radius: 12px; padding: 4px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .admin-tabs button { flex: 1; border: none; background: none; padding: 10px 6px; border-radius: 9px; font-size: 12.5px; font-weight: 600; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 5px; position: relative; }
  .admin-tabs button .ti { font-size: 15px; }
  .admin-tabs button.active { background: var(--primary); color: #fff; }
  .admin-section { background: var(--surface); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .admin-section-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .admin-section-title .ti { color: var(--primary); }
  .admin-section-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
  
  .node-picker { display: flex; flex-wrap: wrap; gap: 6px; max-height: 150px; overflow-y: auto; padding: 8px; background: #f8fafc; border-radius: 12px; border: 1px solid var(--border); }
  .node-picker .pick-item { padding: 6px 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); font-size: 11.5px; cursor: pointer; font-weight: 600; }
  .node-picker .pick-item.selected { background: var(--primary); color: #fff; border-color: var(--primary); }

  @media (min-width: 640px) {
    .sheet { max-width: 500px; margin: 0 auto; }
    .canvas-wrap, .admin-wrap { max-width: 720px; margin: 0 auto; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

/* ============ DATA & CONSTANTS ============ */
const ADMIN_PASSWORD = "09928710944";
const ICONS = { hard: "ti-code", soft: "ti-users", tool: "ti-tool", cert: "ti-certificate", biz: "ti-briefcase" };

const STAGES = [
  { id: "junior", title: "سطح مبتدی", subtitle: "شروع مسیر مالی", icon: "ti-seedling", class: "stage-beg" },
  { id: "mid",    title: "سطح متوسط", subtitle: "تحلیل‌گر حرفه‌ای", icon: "ti-chart-line", class: "stage-mid" },
  { id: "senior", title: "سطح پیشرفته", subtitle: "مدیر مالی / استراتژیست", icon: "ti-crown", class: "stage-adv" }
];

const RESOURCE_TYPES = {
  course:       { label: "دوره",       icon: "ti-school",          color: "type-course" },
  bootcamp:     { label: "بوتکمپ",     icon: "ti-rocket",          color: "type-bootcamp" },
  video:        { label: "ویدیو",      icon: "ti-player-play",     color: "type-video" },
  article:      { label: "مقاله",      icon: "ti-file-text",       color: "type-article" },
  book:         { label: "کتاب",       icon: "ti-book",            color: "type-book" },
  docs:         { label: "مستندات",    icon: "ti-file-description",color: "type-docs" },
  file:         { label: "فایل",       icon: "ti-paperclip",       color: "type-file" },
  podcast:      { label: "پادکست",     icon: "ti-microphone",      color: "type-podcast" },
  newsletter:   { label: "خبرنامه",    icon: "ti-mail",            color: "type-newsletter" },
  community:    { label: "انجمن",      icon: "ti-users-group",     color: "type-community" },
  tool:         { label: "ابزار",      icon: "ti-tool",            color: "type-tool" },
  certification:{ label: "گواهینامه",  icon: "ti-certificate",     color: "type-certification" },
  other:        { label: "سایر",       icon: "ti-link",            color: "type-other" },
};

const LEVELS = [
  { key: "مبتدی",   dot: "dot-beginner",     label: "مبتدی" },
  { key: "متوسط",   dot: "dot-intermediate", label: "متوسط" },
  { key: "پیشرفته", dot: "dot-advanced",     label: "پیشرفته" },
];

const getFileExt = (url) => {
  if (!url) return "";
  const m = url.split("?")[0].match(/\.([a-z0-9]+)$/i);
  return m ? m[1].toLowerCase() : "";
};
const FILE_EXT_ICON = { xlsx: "ti-file-spreadsheet", xls: "ti-file-spreadsheet", csv: "ti-file-spreadsheet", pdf: "ti-file-type-pdf", docx: "ti-file-type-doc", doc: "ti-file-type-doc", pptx: "ti-file-type-ppt", ppt: "ti-file-type-ppt", zip: "ti-file-zip" };

const KEY = "fin-roadmap-v7";
const loadState = () => {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (!raw) return { nodes: INITIAL_NODES, suggestions: INITIAL_RESOURCES, statuses: {}, skipped: {}, votes: {}, collapsed: {} };
    return {
      nodes: raw.nodes || INITIAL_NODES,
      suggestions: raw.suggestions || INITIAL_RESOURCES,
      statuses: raw.statuses || {},
      skipped: raw.skipped || {},
      votes: raw.votes || {},
      collapsed: raw.collapsed || {}
    };
  } catch { return { nodes: INITIAL_NODES, suggestions: INITIAL_RESOURCES, statuses: {}, skipped: {}, votes: {}, collapsed: {} }; }
};

function ResourceBadges({ r }) {
  const t = RESOURCE_TYPES[r.type] || RESOURCE_TYPES.other;
  const ext = r.type === "file" ? getFileExt(r.url) : "";
  return (
    <div className="res-badges">
      <span className={"badge " + t.color}>
        <i className={"ti " + (ext && FILE_EXT_ICON[ext] ? FILE_EXT_ICON[ext] : t.icon)}></i>
        {t.label}{ext ? ` • ${ext.toUpperCase()}` : ""}
      </span>
      {r.pricing && <span className={"badge badge-" + r.pricing}>
        <i className={"ti " + (r.pricing === "free" ? "ti-gift" : r.pricing === "paid" ? "ti-coin" : "ti-star")}></i>
        {r.pricing === "free" ? "رایگان" : r.pricing === "paid" ? "پولی" : "نیمه‌رایگان"}
      </span>}
      {r.lang && <span className="badge badge-lang"><i className="ti ti-language"></i>{r.lang === "fa" ? "فارسی" : "انگلیسی"}</span>}
      <span className={"badge badge-source-" + r.source}>
        <i className={"ti " + (r.source === "admin" ? "ti-shield-check" : "ti-user")}></i>
        {r.source === "admin" ? "تیم محتوا" : "جامعه"}
      </span>
      {isNew(r.createdAt) && <span className="badge badge-new"><i className="ti ti-sparkles"></i>جدید</span>}
    </div>
  );
}

function ResourceCard({ r, userVote, onVote }) {
  const t = RESOURCE_TYPES[r.type] || RESOURCE_TYPES.other;
  const ext = r.type === "file" ? getFileExt(r.url) : "";
  const icon = ext && FILE_EXT_ICON[ext] ? FILE_EXT_ICON[ext] : t.icon;
  return (
    <div className="res-card">
      <div className="res-card-top">
        <div className={"res-type-icon " + t.color}><i className={"ti " + icon}></i></div>
        <div className="res-card-body">
          <div className="res-title">{r.title}</div>
          <a className="res-url" href={r.url} target="_blank" rel="noreferrer">{r.url}</a>
          <ResourceBadges r={r} />
        </div>
      </div>
      {r.reason && <div style={{ fontSize: 11.5, color: "var(--text-muted)", marginTop: 4 }}>💡 {r.reason}</div>}
      <div className="res-vote-row">
        <button className={"vote-btn " + (userVote === "up" ? "voted-up" : "")} onClick={() => onVote(r.id, "up")}>
          <i className="ti ti-thumb-up"></i> {r.votes?.up || 0}
        </button>
        <button className={"vote-btn " + (userVote === "down" ? "voted-down" : "")} onClick={() => onVote(r.id, "down")}>
          <i className="ti ti-thumb-down"></i> {r.votes?.down || 0}
        </button>
      </div>
    </div>
  );
}
function LevelGroup({ level, resources, userVotes, collapsed, onToggle, onVote }) {
  const [typeFilter, setTypeFilter] = useState("all");
  if (resources.length === 0) return null;
  const typeCounts = resources.reduce((acc, r) => { acc[r.type] = (acc[r.type] || 0) + 1; return acc; }, {});
  const filtered = typeFilter === "all" ? resources : resources.filter(r => r.type === typeFilter);

  return (
    <div className="level-group">
      <div className="level-header" onClick={() => onToggle(level.key)}>
        <span className={"level-dot " + level.dot}></span>
        <span className="level-name">{level.label}</span>
        <span className="level-count">{resources.length} منبع</span>
        <i className={"ti ti-chevron-down level-chevron " + (!collapsed ? "open" : "")}></i>
      </div>
      {!collapsed && (
        <div className="level-body">
          {Object.keys(typeCounts).length > 1 && (
            <div className="type-filter-row">
              <div className={"type-filter " + (typeFilter === "all" ? "active" : "")} onClick={() => setTypeFilter("all")}>
                <i className="ti ti-list"></i> همه
              </div>
              {Object.keys(typeCounts).map(t => (
                <div key={t} className={"type-filter " + (typeFilter === t ? "active" : "")} onClick={() => setTypeFilter(t)}>
                  <i className={"ti " + RESOURCE_TYPES[t].icon}></i> {RESOURCE_TYPES[t].label} ({typeCounts[t]})
                </div>
              ))}
            </div>
          )}
          {filtered.map(r => (
            <ResourceCard key={r.id} r={r} userVote={userVotes[r.id]} onVote={onVote} />
          ))}
        </div>
      )}
    </div>
  );
}

    onSubmit({ nodeId: node.id, ...form, id: Date.now(), source: "user", status: "pending", votes: { up: 0, down: 0 }, createdAt: new Date().toISOString() });

          {Object.entries(RESOURCE_TYPES).map(([k, v]) => (

      <div className="form-row">

      <div className="form-actions">
        <button className="btn-secondary" onClick={onBack}>بازگشت</button>
        <button className="btn-primary" onClick={submit}>ثبت پیشنهاد</button>
      </div>
    </div>
  );
}

    e.preventDefault();
    if (pass === ADMIN_PASSWORD) onLogin();
    else alert("رمز عبور اشتباه است!");
  };
  return (

function StageSection({ stage, nodes, statuses, skipped, onNodeClick, onSkip, resourceCount }) {
  const stageNodes = nodes.filter(n => n.stageId === stage.id);
  const allDone = stageNodes.length > 0 && stageNodes.every(n => statuses[n.id] === "done" || skipped[stage.id]);
  const isSkipped = skipped[stage.id];

  return (
    <div className={`stage-container ${stage.class}`}>
      <div className="stage-header">
        <div className="stage-dot"><i className={"ti " + stage.icon}></i></div>
        <div>
          <div className="stage-title">{stage.title}</div>
          <div className="stage-sub">{stage.subtitle}</div>
        </div>
      </div>

      {stageNodes.map(node => {
        const status = statuses[node.id];
        const count = resourceCount(node.id);
        return (
          <div className="node-row" key={node.id}>
            <div className="node-indicator">
              <div className={`node-circle ${status === 'done' || isSkipped ? 'done' : status === 'learning' ? 'learning' : ''}`}>
                <i className="ti ti-check" style={{ fontWeight: 900 }}></i>
              </div>
            </div>
            <div className={`node-card cat-${node.cat} ${status ? "status-" + status : ""}`} onClick={() => onNodeClick(node)} style={{ opacity: isSkipped ? 0.7 : 1 }}>
              <div className="node-icon"><i className={"ti " + ICONS[node.cat]}></i></div>
              <div className="node-body">
                <div className="node-title">{node.title}</div>
                <div className="node-meta">
                  {node.level} • {node.hours} ساعت
                  {count > 0 && <span className="resource-badge">{count} منبع</span>}
                </div>
              </div>
            </div>
          </div>
        );
      })}

      <button 
        className={`skip-btn ${allDone || isSkipped ? 'done' : ''}`} 
        onClick={() => !allDone && !isSkipped && onSkip(stage.id)}
        disabled={allDone || isSkipped}
      >
        {allDone || isSkipped ? (
          <><i className="ti ti-checks"></i> این سطح تکمیل شد</>
        ) : (
          <><i className="ti ti-bolt"></i> من این سطح را بلدم، رد شو</>
        )}
      </button>
    </div>
  );
}

function AdminPanel({ state, setState, showToast }) {
  const [tab, setTab] = useState("nodes"); // nodes | add | pending
  const [selectedNode, setSelectedNode] = useState(null);
  const [showNodeForm, setShowNodeForm] = useState(false);
  const [newNode, setNewNode] = useState({ title: "", stageId: "junior", cat: "hard", hours: 10, level: "مبتدی", desc: "" });
  const [newRes, setNewRes] = useState({ title: "", url: "", reason: "", type: "course", pricing: "free", level: "مبتدی", lang: "fa" });

  const pending = state.suggestions.filter(s => s.status === "pending");
  
  const addNode = () => {
    if (!newNode.title) return;
    const node = { ...newNode, id: "node_" + Date.now() };
    setState(s => ({ ...s, nodes: [...s.nodes, node] }));
    setNewNode({ title: "", stageId: "junior", cat: "hard", hours: 10, level: "مبتدی", desc: "" });
    setShowNodeForm(false);
    showToast("گره جدید اضافه شد ✓");
  };

  const addResource = () => {
    if (!selectedNode || !newRes.title || !newRes.url) return;
    const res = { ...newRes, nodeId: selectedNode.id, id: "res_" + Date.now(), source: "admin", status: "approved", votes: { up: 0, down: 0 }, createdAt: new Date().toISOString() };
    setState(s => ({ ...s, suggestions: [...s.suggestions, res] }));
    setNewRes({ title: "", url: "", reason: "", type: "course", pricing: "free", level: selectedNode.level || "مبتدی", lang: "fa" });
    showToast("منبع با موفقیت اضافه شد ✓");
  };

  const approveSuggestion = (id) => {
    setState(s => ({ ...s, suggestions: s.suggestions.map(x => x.id === id ? { ...x, status: "approved" } : x) }));
    showToast("تأیید شد ✓");
  };
  const rejectSuggestion = (id) => {
    setState(s => ({ ...s, suggestions: s.suggestions.filter(x => x.id !== id) }));
    showToast("رد شد");
  };

  return (
    <div className="admin-wrap">
      <div className="admin-tabs">
        <button className={tab === "nodes" ? "active" : ""} onClick={() => setTab("nodes")}>
          <i className="ti ti-list-details"></i> مدیریت گره‌ها

                    <div>
                      <div style={{ fontWeight: 700, fontSize: 14 }}>{node.title}</div>
                      <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 4 }}>{resCount} منبع ثبت شده</div>
                    </div>
                    <button 
                      onClick={() => setState(s => ({ ...s, nodes: s.nodes.filter(n => n.id !== node.id), suggestions: s.suggestions.filter(r => r.nodeId !== node.id) }))}
                      style={{ background: 'none', border: 'none', color: 'var(--danger)', fontSize: 20, cursor: 'pointer' }}
                    >
                      <i className="ti ti-trash"></i>
                    </button>
                  </div>
                );
              })}
            </div>
          ))}
        </>
      )}

      {tab === "add" && (
        <>
          {!selectedNode ? (
            <div className="admin-section">
              <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 12 }}>۱. گره مورد نظر را انتخاب کنید</div>
              <div className="node-picker">
                {state.nodes.map(n => (
                  <div key={n.id} className="pick-item" onClick={() => { setSelectedNode(n); setNewRes({ ...newRes, level: n.level || "مبتدی" }); }}>
                    {n.title}
                  </div>
                ))}
              </div>
            </div>
          ) : (
            <div className="admin-section" style={{ background: '#f0fdf4', borderColor: '#86efac' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 16 }}>
                <div style={{ fontWeight: 700, color: '#166534' }}>گره انتخاب شده: {selectedNode.title}</div>
                <button onClick={() => setSelectedNode(null)} style={{ background: 'none', border: 'none', color: 'var(--primary)', fontSize: 13, cursor: 'pointer' }}>تغییر</button>
              </div>
              
              <div className="form-field"><label>نوع منبع</label>
                <div className="type-picker">
                  {Object.entries(RESOURCE_TYPES).map(([k, v]) => (
                    <div key={k} className={"type-item " + (newRes.type === k ? "selected" : "")} onClick={() => setNewRes({ ...newRes, type: k })}>
                      <i className={"ti " + v.icon}></i>{v.label}
                    </div>
                  ))}
                </div>
              </div>
              <div className="form-field"><label>سطح منبع</label>
                <div className="level-picker">
                  {LEVELS.map(lv => (
                    <div key={lv.key} className={"lv-item " + (newRes.level === lv.key ? "selected" : "")} onClick={() => setNewRes({ ...newRes, level: lv.key })}>
                      <span className={"dot " + lv.dot} style={{ background: lv.dot === "dot-beginner" ? "var(--lvl-beg)" : lv.dot === "dot-intermediate" ? "var(--lvl-mid)" : "var(--lvl-adv)" }}></span>
                      {lv.label}
                    </div>
                  ))}
                </div>
              </div>
              <div className="form-field"><label>عنوان منبع</label><input placeholder="عنوان" value={newRes.title} onChange={e => setNewRes({ ...newRes, title: e.target.value })} /></div>
              <div className="form-field"><label>لینک</label><input placeholder="https://..." value={newRes.url} onChange={e => setNewRes({ ...newRes, url: e.target.value })} /></div>
              <div className="form-row">
                <div className="form-field"><label>قیمت</label>
                  <select value={newRes.pricing} onChange={e => setNewRes({ ...newRes, pricing: e.target.value })}>
                    <option value="free">رایگان</option><option value="freemium">نیمه‌رایگان</option><option value="paid">پولی</option>
                  </select>
                </div>
                <div className="form-field"><label>زبان</label>
                  <select value={newRes.lang} onChange={e => setNewRes({ ...newRes, lang: e.target.value })}>
                    <option value="fa">فارسی</option><option value="en">انگلیسی</option>
                  </select>
                </div>
              </div>
              <div className="form-field"><label>توضیح کوتاه</label><textarea rows={2} value={newRes.reason} onChange={e => setNewRes({ ...newRes, reason: e.target.value })} /></div>
              <button className="action-btn" onClick={addResource}><i className="ti ti-check"></i> ثبت منبع برای این گره</button>
            </div>
          )}
        </>
      )}

      {tab === "pending" && (
        <>
          {pending.length === 0 ? (
            <div className="empty-state"><i className="ti ti-inbox"></i>پیشنهاد جدیدی در انتظار نیست</div>
          ) : pending.map(s => {
            const node = state.nodes.find(n => n.id === s.nodeId);
            return (
              <div key={s.id} className="admin-section">
                <div className="admin-section-title"><i className="ti ti-file-plus"></i>{s.title}</div>
                <div className="admin-section-sub">برای گره: <strong>{node ? node.title : 'نامشخص'}</strong></div>
                <a className="res-url" href={s.url} target="_blank" rel="noreferrer">{s.url}</a>
                <ResourceBadges r={{ ...s, status: "pending" }} />
                {s.reason && <div style={{ fontSize: 12, color: "var(--text-muted)", marginTop: 8 }}>{s.reason}</div>}
                <div className="res-actions" style={{ display: 'flex', gap: 8, marginTop: 12 }}>
                  <button className="btn-secondary" style={{ color: 'var(--danger)' }} onClick={() => rejectSuggestion(s.id)}><i className="ti ti-x"></i> رد</button>
                  <button className="btn-primary" onClick={() => approveSuggestion(s.id)}><i className="ti ti-check"></i> تأیید</button>
                </div>
              </div>
            );
          })}
        </>
      )}
    </div>
  );
}

function App() {
  const [state, setState] = useState(loadState);
  const [role, setRole] = useState("user");
  const [isAdminAuth, setIsAdminAuth] = useState(false);
  
  const [selectedNode, setSelectedNode] = useState(null);
  const [view, setView] = useState("detail");
  const [toast, setToast] = useState("");

  useEffect(() => saveState(state), [state]);

  const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(""), 2000); };

  const handleSkipStage = (stageId) => {
    if (window.confirm("آیا مطمئن هستید که تمام گره‌های این سطح را بلد هستید؟")) {
      setState(s => ({ ...s, skipped: { ...s.skipped, [stageId]: true } }));
      showToast("سطح با موفقیت رد شد! 🚀");
    }
  };

  const setNodeStatus = (id, status) => setState(s => ({ ...s, statuses: { ...s.statuses, [id]: status } }));
  const toggleLevel = (key) => setState(s => ({ ...s, collapsed: { ...s.collapsed, [key]: !s.collapsed[key] } }));

  const addSuggestion = (sug) => {
    setState(s => ({ ...s, suggestions: [...s.suggestions, sug] }));
    showToast("پیشنهاد شما ثبت شد ✓");
    setView("detail");
  };

  const voteResource = (resId, dir) => {
    setState(s => {
      const current = s.votes[resId];
      const newVotes = { ...s.votes };
      if (current === dir) delete newVotes[resId];
      else newVotes[resId] = dir;
      const suggestions = s.suggestions.map(r => {
        if (r.id !== resId) return r;
        const v = { ...(r.votes || { up: 0, down: 0 }) };
        if (current === "up") v.up = Math.max(0, v.up - 1);
        if (current === "down") v.down = Math.max(0, v.down - 1);
        if (dir === "up" && current !== "up") v.up++;
        if (dir === "down" && current !== "down") v.down++;
        return { ...r, votes: v };
      });
      return { ...s, votes: newVotes, suggestions };
    });
  };

  const resourceCount = (nodeId) => state.suggestions.filter(r => r.nodeId === nodeId && r.status === "approved").length;

  const progress = useMemo(() => {
    if (state.nodes.length === 0) return 0;
    let doneCount = 0;
    state.nodes.forEach(n => {
      if (state.statuses[n.id] === "done" || state.skipped[n.stageId]) doneCount++;
    });
    return Math.round((doneCount / state.nodes.length) * 100);
  }, [state]);

  return (
    <>
      <div className="top-bar">
        <div className="top-title-row">
          <div className="top-title">
            <i className="ti ti-route"></i>
            {role === "user" ? "نقشه راه تحلیل‌گر مالی" : "پنل مدیریت"}
          </div>
          <div className="role-toggle">
            <button className={role === "user" ? "active" : ""} onClick={() => setRole("user")}>
              <i className="ti ti-user"></i> کاربر
            </button>
            <button className={role === "admin" ? "active" : ""} onClick={() => setRole("admin")}>
              <i className="ti ti-shield-lock"></i> ادمین
            </button>
          </div>
          {role === "user" && <div className="pct-badge">{progress}%</div>}
        </div>
        {role === "user" && (
          <div className="progress-track">
            <div className="progress-fill" style={{ width: progress + "%" }} />
          </div>
        )}
      </div>

      {role === "user" ? (
        <div className="canvas-wrap">
          {STAGES.map(stage => (
            <StageSection 
              key={stage.id} 
              stage={stage} 
              nodes={state.nodes} 
              statuses={state.statuses} 
              skipped={state.skipped}
              onNodeClick={(n) => { setSelectedNode(n); setView("detail"); }}
              onSkip={handleSkipStage}
              resourceCount={resourceCount}
            />
          ))}
        </div>
      ) : (
        !isAdminAuth ? (
          <AdminLogin onLogin={() => setIsAdminAuth(true)} />
        ) : (
          <AdminPanel state={state} setState={setState} showToast={showToast} />
        )
      )}

      {role === "user" && (
        <>
          <div className={"sheet-backdrop " + (selectedNode ? "show" : "")} onClick={() => setSelectedNode(null)}></div>
          <div className={"sheet " + (selectedNode ? "show" : "")}>
            <div className="sheet-handle"></div>
            {selectedNode && (
              <>
                <div className="sheet-header">
                  <div className={"sheet-icon cat-" + selectedNode.cat}><i className={"ti " + ICONS[selectedNode.cat]}></i></div>
                  <div className="sheet-title">
                    <div>{selectedNode.title}</div>
                    <div className="sheet-subtitle">{selectedNode.level} • {selectedNode.hours} ساعت</div>
                  </div>
                  <button className="sheet-close" onClick={() => setSelectedNode(null)}><i className="ti ti-x"></i></button>
                </div>
                {view === "detail" ? (
                  <DetailSheet 
                    node={selectedNode} 
                    statuses={state.statuses} 
                    resources={state.suggestions} 
                    userVotes={state.votes}
                    collapsed={state.collapsed}
                    onStatusChange={setNodeStatus} 
                    onSuggest={() => setView("suggest")} 
                    onVote={voteResource}
                    onToggleLevel={toggleLevel}
                  />
                ) : (
                  <SuggestSheet 
                    node={selectedNode} 
                    onBack={() => setView("detail")} 
                    onSubmit={addSuggestion} 
                  />
                )}
              </>
            )}
          </div>
        </>
      )}

      <div className={"toast " + (toast ? "show" : "")}>{toast}</div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>
